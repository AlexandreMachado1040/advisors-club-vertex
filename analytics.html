<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Analytics — Advisors Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root {
  --gold:      #c9a84c;
  --gold-dim:  #a07830;
  --dark:      #0d0b08;
  --dark-2:    #141209;
  --dark-3:    #1a1710;
  --dark-4:    #221e14;
  --border:    rgba(201,168,76,0.12);
  --border-hard: rgba(201,168,76,0.28);
  --text:      #f0ead8;
  --text-muted:#9a8f78;
  --green:     #4caf82;
  --red:       #e05a5a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--dark); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

/* ── LOGIN ── */
#screen-login {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 50% 0%, rgba(201,168,76,0.07) 0%, transparent 70%);
}
.login-card {
  width: 380px; background: var(--dark-2); border: 1px solid var(--border);
  border-radius: 16px; padding: 48px 40px; text-align: center;
}
.login-eyebrow {
  font-size: 9px; letter-spacing: .3em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 20px;
}
.login-title {
  font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300;
  color: var(--text); margin-bottom: 6px;
}
.login-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 32px; }
.login-input {
  width: 100%; background: var(--dark-3); border: 1px solid var(--border);
  border-radius: 8px; padding: 13px 16px; color: var(--text);
  font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none;
  margin-bottom: 16px; transition: border-color .2s; text-align: center;
  letter-spacing: .12em;
}
.login-input:focus { border-color: var(--border-hard); }
.login-btn {
  width: 100%; padding: 13px; border-radius: 40px; border: none; cursor: pointer;
  background: linear-gradient(135deg, var(--gold), var(--gold-dim));
  color: var(--dark); font-family: 'DM Sans', sans-serif; font-size: 13px;
  font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  box-shadow: 0 6px 24px rgba(201,168,76,0.3);
  transition: opacity .2s, transform .2s, box-shadow .2s;
}
.login-btn:hover { opacity: .9; transform: translateY(-2px); box-shadow: 0 10px 32px rgba(201,168,76,0.4); }
.login-error { font-size: 12px; color: var(--red); margin-top: 14px; min-height: 18px; }

/* ── DASHBOARD ── */
#screen-dashboard { display: none; }

.dash-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 40px; border-bottom: 1px solid var(--border);
  background: var(--dark-2); position: sticky; top: 0; z-index: 10;
}
.dash-logo {
  font-family: 'Cormorant Garamond', serif; font-size: 20px;
  font-weight: 300; color: var(--text);
}
.dash-logo span { color: var(--gold); }
.dash-header-right { display: flex; align-items: center; gap: 16px; }
.dash-refresh {
  background: transparent; border: 1px solid var(--border); border-radius: 40px;
  padding: 7px 16px; color: var(--text-muted); font-family: 'DM Sans', sans-serif;
  font-size: 12px; cursor: pointer; transition: all .2s;
}
.dash-refresh:hover { border-color: var(--border-hard); color: var(--text); }
.dash-logout {
  background: transparent; border: 1px solid var(--border); border-radius: 40px;
  padding: 7px 16px; color: var(--text-muted); font-family: 'DM Sans', sans-serif;
  font-size: 12px; cursor: pointer; transition: all .2s;
}
.dash-logout:hover { border-color: var(--red); color: var(--red); }

.dash-body { padding: 40px; max-width: 1200px; margin: 0 auto; }

/* ── KPI CARDS ── */
.kpi-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 48px;
}
.kpi-card {
  background: var(--dark-2); border: 1px solid var(--border);
  border-radius: 14px; padding: 28px 24px;
}
.kpi-value {
  font-family: 'Cormorant Garamond', serif; font-size: 42px; font-weight: 300;
  color: var(--gold); line-height: 1; margin-bottom: 8px;
}
.kpi-label { font-size: 11px; letter-spacing: .15em; text-transform: uppercase; color: var(--text-muted); }

/* ── SECTIONS ── */
.section { margin-bottom: 48px; }
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--border);
}
.section-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; }
.section-count { font-size: 12px; color: var(--text-muted); }

/* ── TABLE ── */
.table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; }
thead tr { background: var(--dark-3); }
th {
  padding: 14px 20px; text-align: left; font-size: 10px;
  letter-spacing: .2em; text-transform: uppercase; color: var(--text-muted);
  font-weight: 500; white-space: nowrap;
}
tbody tr { border-top: 1px solid var(--border); transition: background .15s; }
tbody tr:hover { background: rgba(201,168,76,0.04); }
td { padding: 16px 20px; font-size: 13px; vertical-align: middle; }
td.empresa { font-weight: 500; color: var(--text); max-width: 180px; }
td.email { color: var(--text-muted); font-size: 12px; }
.empresa-label { font-size: 10px; color: var(--text-muted); font-weight: 400; margin-top: 2px; }

/* ── MODULE DOTS ── */
.mod-dots { display: flex; gap: 5px; flex-wrap: wrap; }
.mod-dot {
  width: 26px; height: 26px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 10px; font-weight: 600;
  flex-shrink: 0;
}
.mod-dot.done { background: rgba(201,168,76,0.2); border: 1.5px solid var(--gold); color: var(--gold); }
.mod-dot.pending { background: transparent; border: 1.5px solid var(--border); color: var(--text-muted); }

/* ── TAGS ── */
.tag-sim { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--green); }
.tag-nao { font-size: 11px; color: var(--text-muted); }
.dot-green { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

/* ── REPORTS LIST ── */
.report-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px; border-radius: 10px; background: var(--dark-2);
  border: 1px solid var(--border); margin-bottom: 10px;
}
.report-empresa { font-size: 13px; font-weight: 500; }
.report-email { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.report-date { font-size: 11px; color: var(--text-muted); text-align: right; }

/* ── EMPTY ── */
.empty { text-align: center; padding: 48px; color: var(--text-muted); font-size: 13px; }

/* ── LOADING ── */
.loading-overlay {
  position: fixed; inset: 0; background: rgba(13,11,8,0.85);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; font-size: 13px; color: var(--text-muted);
}

@media (max-width: 768px) {
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .dash-body { padding: 20px; }
  .dash-header { padding: 16px 20px; }
}
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="screen-login">
  <div class="login-card">
    <div class="login-eyebrow">Advisors Club</div>
    <h1 class="login-title">Analytics</h1>
    <p class="login-sub">Painel exclusivo — Caroline Calaça</p>
    <input type="password" id="login-pw" class="login-input" placeholder="••••••••"
      onkeydown="if(event.key==='Enter') doLogin()">
    <button class="login-btn" onclick="doLogin()">Acessar →</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ══ DASHBOARD ══ -->
<div id="screen-dashboard">
  <header class="dash-header">
    <div class="dash-logo">Advisory <span>·</span> Analytics</div>
    <div class="dash-header-right">
      <button class="dash-refresh" onclick="loadData()">↺ Atualizar</button>
      <button class="dash-logout" onclick="doLogout()">Sair</button>
    </div>
  </header>

  <div class="dash-body">
    <!-- KPIs -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-value" id="kpi-sessions">—</div>
        <div class="kpi-label">Mentoradas</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-value" id="kpi-modules">—</div>
        <div class="kpi-label">Módulos Concluídos</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-value" id="kpi-reports">—</div>
        <div class="kpi-label">Relatórios Enviados</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-value" id="kpi-avg">—</div>
        <div class="kpi-label">Média / Mentorada</div>
      </div>
    </div>

    <!-- Sessions -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">Mentoradas</div>
        <div class="section-count" id="sessions-count"></div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Empresa / Mentorada</th>
              <th>E-mail</th>
              <th>Progresso (8 módulos)</th>
              <th>Última atividade</th>
              <th>Relatório</th>
            </tr>
          </thead>
          <tbody id="sessions-body">
            <tr><td colspan="5" class="empty">Carregando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Reports -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">Relatórios Enviados</div>
        <div class="section-count" id="reports-count"></div>
      </div>
      <div id="reports-list">
        <div class="empty">Carregando…</div>
      </div>
    </div>
  </div>
</div>

<script>
const API_AUTH     = '/api/admin-auth';
const API_DATA     = '/api/analytics';
const TOKEN_KEY    = 'advisory_admin_token';

let moduleProgressBySession = {};

function getToken() { return localStorage.getItem(TOKEN_KEY); }

async function doLogin() {
  const pw  = document.getElementById('login-pw').value.trim();
  const err = document.getElementById('login-error');
  err.textContent = '';

  if (!pw) { err.textContent = 'Digite a senha.'; return; }

  try {
    const res  = await fetch(API_AUTH, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    const data = await res.json();

    if (!res.ok) {
      err.textContent = data.error || 'Senha incorreta.';
      return;
    }

    localStorage.setItem(TOKEN_KEY, data.token);
    showDashboard();
  } catch(e) {
    err.textContent = 'Erro de conexão.';
  }
}

function doLogout() {
  localStorage.removeItem(TOKEN_KEY);
  document.getElementById('screen-dashboard').style.display = 'none';
  document.getElementById('screen-login').style.display = 'flex';
  document.getElementById('login-pw').value = '';
}

function showDashboard() {
  document.getElementById('screen-login').style.display = 'none';
  document.getElementById('screen-dashboard').style.display = 'block';
  loadData();
}

async function loadData() {
  const token = getToken();
  if (!token) return;

  try {
    const res  = await fetch(API_DATA, {
      headers: { 'Authorization': `Bearer ${token}` }
    });

    if (res.status === 401) { doLogout(); return; }

    const data = await res.json();
    if (data.error) { alert('Erro: ' + data.error); return; }

    renderKPIs(data.totals);
    buildModuleIndex(data.module_progress);
    renderSessions(data.sessions);
    renderReports(data.reports);
  } catch(e) {
    alert('Erro ao carregar dados: ' + e.message);
  }
}

function renderKPIs(t) {
  document.getElementById('kpi-sessions').textContent = t.sessions;
  document.getElementById('kpi-modules').textContent  = t.modules_completed;
  document.getElementById('kpi-reports').textContent  = t.reports_sent;
  document.getElementById('kpi-avg').textContent      = t.avg_modules;
}

function buildModuleIndex(progress) {
  moduleProgressBySession = {};
  (progress || []).forEach(mp => {
    if (!moduleProgressBySession[mp.session_id]) {
      moduleProgressBySession[mp.session_id] = new Set();
    }
    moduleProgressBySession[mp.session_id].add(mp.module_number);
  });
}

function renderSessions(sessions) {
  const tbody = document.getElementById('sessions-body');
  document.getElementById('sessions-count').textContent =
    sessions.length + (sessions.length === 1 ? ' mentorada' : ' mentoradas');

  if (!sessions.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">Nenhuma sessão registrada ainda.</td></tr>';
    return;
  }

  tbody.innerHTML = sessions.map(s => {
    const empresa  = s.empresa_nome || '—';
    const nome     = s.mentorada_nome || '';
    const email    = s.mentorada_email || '—';
    const dots     = renderModuleDots(s.id);
    const lastAct  = formatDate(s.last_module_at || s.updated_at);
    const relSent  = s.reports_sent > 0
      ? `<span class="tag-sim"><span class="dot-green"></span>${s.reports_sent}x enviado</span>`
      : '<span class="tag-nao">—</span>';

    return `<tr>
      <td class="empresa">
        ${empresa}
        ${nome ? `<div class="empresa-label">${nome}</div>` : ''}
      </td>
      <td class="email">${email}</td>
      <td>${dots}</td>
      <td style="color:var(--text-muted);font-size:12px">${lastAct}</td>
      <td>${relSent}</td>
    </tr>`;
  }).join('');
}

function renderModuleDots(sessionId) {
  const done = moduleProgressBySession[sessionId] || new Set();
  const dots = Array.from({length: 8}, (_, i) => {
    const n = i + 1;
    const cls = done.has(n) ? 'done' : 'pending';
    return `<div class="mod-dot ${cls}" title="M${n}">${n}</div>`;
  });
  return `<div class="mod-dots">${dots.join('')}</div>`;
}

function renderReports(reports) {
  const container = document.getElementById('reports-list');
  document.getElementById('reports-count').textContent =
    reports.length + (reports.length >= 50 ? '+ recentes' : ' total');

  if (!reports.length) {
    container.innerHTML = '<div class="empty">Nenhum relatório enviado ainda.</div>';
    return;
  }

  container.innerHTML = reports.map(r => {
    const empresa = r.empresa_nome || '—';
    const email   = r.mentorada_email || '—';
    const date    = formatDate(r.sent_at);

    return `<div class="report-item">
      <div>
        <div class="report-empresa">${empresa}</div>
        <div class="report-email">${email}</div>
      </div>
      <div class="report-date">${date}</div>
    </div>`;
  }).join('');
}

function formatDate(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleDateString('pt-BR', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  } catch { return '—'; }
}

// Auto-login se já tem token
if (getToken()) {
  showDashboard();
}
</script>
</body>
</html>
